name: Real JavaScript recovery

on:
  pull_request:
    paths:
      - ".github/workflows/real-javascript-recovery.yml"
      - "src/javascript/recovery/**"
      - "src/domain/javascript/**"
      - "src/application/javascript/JavaScriptRecovery*.ts"
      - "src/composition/javascriptRecovery.ts"
      - "src/contracts/javascript/javascriptRecoveryToolContracts.ts"
      - "src/cli/javascriptRecoveryCommands.ts"
      - "src/cli/javascriptApplicationAnalysis.ts"
      - "src/server/registerJavaScriptRecoveryTool.ts"
      - "src/server/createServer.ts"
      - "src/server/sessionAvailabilityPolicy.ts"
      - "src/application/CapabilityInventory.ts"
      - "src/cli.ts"
      - "src/cliCommandNames.ts"
      - "src/contracts/toolContracts.ts"
      - "src/contracts/toolEffects.ts"
      - "scripts/rea.mjs"
      - "src/process/**"
      - "src/artifacts/SafeOutputTree.ts"
      - "scripts/verify/javascript/recovery.mjs"
      - "scripts/fixtures/javascript-recovery/**"
      - "third_party/wakaru"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: javascript-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


env:
  HUSKY: "0"
  NODE_OPTIONS: "--max-old-space-size=2048"
  RAYON_NUM_THREADS: "1"
  APP_SHA: "092ee7ef26be6ab9fe5e2e5a0df8e8c49f9e2490"
  BASE_SHA: "4999e4be2c1669d04417fcdea582052048adbb2d"
  SOURCE_PATH: "src/domain/referenceSourceImportParsing.ts"
  REGRESSION_PATH: "tests/boundary/filesystem/referenceSourceShadowedRequire.test.ts"

jobs:
  reference-shadowed-require-validation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 092ee7ef26be6ab9fe5e2e5a0df8e8c49f9e2490
          fetch-depth: 0
          persist-credentials: false
      - name: Prove application and validation identity
        env:
          CI_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p verification
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          git cat-file -e "$CI_SHA^{commit}"
          git diff --exit-code "$APP_SHA" "$CI_SHA" -- . ':(exclude).github/workflows/real-javascript-recovery.yml'
          printf 'application=%s\nvalidation=%s\nbase=%s\ntree=%s\n' "$APP_SHA" "$CI_SHA" "$BASE_SHA" "$(git rev-parse HEAD^{tree})" > verification/identity.txt
          sha256sum "$SOURCE_PATH" "$REGRESSION_PATH" package-lock.json > verification/application-files.sha256
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm and locked dependencies
        run: |
          npm install --global npm@11.16.0
          node --version | tee verification/node-version.txt
          npm --version | tee verification/npm-version.txt
          npm ci 2>&1 | tee verification/npm-ci.log
      - name: Verify test discovery
        run: npm run verify:test-discovery 2>&1 | tee verification/test-discovery.log
      - name: Require official baseline regression failure
        run: |
          set -euo pipefail
          trap 'git show "$APP_SHA:$SOURCE_PATH" > "$SOURCE_PATH"' EXIT
          git show "$BASE_SHA:$SOURCE_PATH" > "$SOURCE_PATH"
          sha256sum "$SOURCE_PATH" > verification/baseline-source.sha256
          set +e
          npm run test:focused -- "$REGRESSION_PATH" > verification/baseline-official.log 2>&1
          status=$?
          set -e
          cat verification/baseline-official.log
          test "$status" = 1
          set +e
          node node_modules/vitest/vitest.mjs run "$REGRESSION_PATH" --reporter=json --outputFile=verification/baseline.json > verification/baseline-json.log 2>&1
          status=$?
          set -e
          test "$status" = 1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('verification/baseline.json', 'utf8'));
          const assertions = report.testResults?.flatMap(result => result.assertionResults ?? []) ?? [];
          const assertion = assertions[0];
          const messages = assertion?.failureMessages?.join('\n') ?? '';
          if (report.numTotalTests !== 1 || report.numFailedTests !== 1 || assertions.length !== 1 ||
              assertion.status !== 'failed' || assertion.title !== 'does not infer CommonJS dependencies from locally bound or dynamic require lookups' ||
              !messages.includes('AssertionError') || !messages.includes('to deeply equal') ||
              !messages.includes('throwing.cjs') || !messages.includes('requires')) {
            throw new Error('Baseline was not the intended relationship assertion failure');
          }
          fs.writeFileSync('verification/baseline-classified.txt', 'Exactly the intended shadowed-require relationship assertion failed.\n');
          NODE
      - name: Restore and verify exact application source
        if: ${{ always() }}
        run: |
          git show "$APP_SHA:$SOURCE_PATH" > "$SOURCE_PATH"
          sha256sum --check verification/application-files.sha256
          git diff --exit-code "$APP_SHA" -- "$SOURCE_PATH" "$REGRESSION_PATH"
      - name: Fixed official focused boundary regressions
        run: |
          npm run test:focused -- tests/boundary/filesystem/referenceSourceShadowedRequire.test.ts tests/boundary/filesystem/referenceSourceImport.test.ts tests/boundary/filesystem/referenceSourceComputedRequire.test.ts tests/boundary/filesystem/referenceSourceDynamicImports.test.ts 2>&1 | tee verification/fixed-focused.log
      - name: Required static checks
        run: npm run check 2>&1 | tee verification/npm-check.log
      - name: Required cached runtime build
        run: npm run build:cached 2>&1 | tee verification/build-cached.log
      - name: Final application identity
        run: |
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          sha256sum --check verification/application-files.sha256
          git diff --exit-code "$APP_SHA" -- "$SOURCE_PATH" "$REGRESSION_PATH"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: reference-shadowed-require-verification
          path: verification
          if-no-files-found: error
          retention-days: 7
