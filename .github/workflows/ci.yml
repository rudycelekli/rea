name: REA3660 exact paired Kuna CI classification
'on': workflow_dispatch
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ref:
        - 1b56237caec20f1f729b4681611581a77bf8b239
        - bebe7a1b3e57611565fa59ed89693a0a88c64f65
    env:
      HUSKY: '0'
      CI: 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: morluto/rea
        ref: ${{ matrix.ref }}
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.18.0
    - name: Freeze exact source identity
      run: 'test "$(git rev-parse HEAD)" = ''${{ matrix.ref }}''

        git rev-parse HEAD^{tree} > /tmp/source-tree.txt

        sha256sum package-lock.json tests/boundary/providers/kuna/kunaProvider.test.ts
        > /tmp/source-identities.txt

        node --version > /tmp/versions.log

        npm --version >> /tmp/versions.log'
    - name: Locked dependency installation
      run: npm ci > /tmp/npm-ci.log 2>&1
    - name: Build required test artifacts
      run: npm run build:cached > /tmp/build.log 2>&1
    - name: Exact single lifecycle regression with observable classification
      run: 'set +e

        npx vitest run --project boundary tests/boundary/providers/kuna/kunaProvider.test.ts
        -t ''^waits for an aborted pre-session hash before retrying its late close
        owner$'' --reporter=junit --outputFile=/tmp/targeted.xml > /tmp/targeted.log
        2>&1

        code=$?

        set -e

        export TEST_EXIT="$code"

        python - <<''EVAL''

        import os,json,xml.etree.ElementTree as E

        from pathlib import Path

        r=E.parse(''/tmp/targeted.xml'').getroot();cases=r.findall(''.//testcase'');selected=[x
        for x in cases if x.find(''skipped'') is None];assert len(selected)==1 and
        selected[0].get(''name'','''').endswith(''waits for an aborted pre-session
        hash before retrying its late close owner'');assert not r.findall(''.//error'')

        f=selected[0].find(''failure'');code=int(os.environ[''TEST_EXIT'']);assert
        (code==0 and f is None) or (code==1 and f is not None and f.get(''type'')==''AssertionError''),(code,E.tostring(r).decode())

        Path(''/tmp/classification.json'').write_text(json.dumps({''ref'':''${{ matrix.ref
        }}'',''selected'':1,''other_skipped'':len(cases)-1,''semantic_failures'':int(f
        is not None),''test_exit'':code,''failure'':None if f is None else ''''.join(f.itertext())},indent=2))

        EVAL'
    - name: Final tracked source guards
      if: always()
      run: 'git diff --exit-code

        sha256sum --check /tmp/source-identities.txt

        test "$(git rev-parse HEAD^{tree})" = "$(cat /tmp/source-tree.txt)"'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: rea3660-${{ matrix.ref }}
        path: '/tmp/source-tree.txt

          /tmp/source-identities.txt

          /tmp/versions.log

          /tmp/npm-ci.log

          /tmp/build.log

          /tmp/targeted.log

          /tmp/targeted.xml

          /tmp/classification.json'
        if-no-files-found: error
